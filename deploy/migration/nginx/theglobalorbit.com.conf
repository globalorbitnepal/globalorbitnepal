# =============================================================================
# Apex virtual host — Global Orbit Next.js (PM2 on 127.0.0.1:3031)
# Staging arnav.theglobalorbit.com remains a separate vhost (301 → apex).
# =============================================================================

# HTTP → HTTPS (apex + www)
server {
    listen 80;
    listen [::]:80;
    server_name theglobalorbit.com www.theglobalorbit.com;

    # ACME challenges if using webroot (optional)
    # location ^~ /.well-known/acme-challenge/ {
    #     root /var/www/letsencrypt;
    #     default_type "text/plain";
    # }

    location / {
        return 301 https://theglobalorbit.com$request_uri;
    }
}

# www → apex (canonical host)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.theglobalorbit.com;

    # REPLACE after certbot (example paths):
    ssl_certificate     /etc/letsencrypt/live/theglobalorbit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theglobalorbit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://theglobalorbit.com$request_uri;
}

# Apex — application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theglobalorbit.com;

    ssl_certificate     /etc/letsencrypt/live/theglobalorbit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theglobalorbit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security / proxy hygiene
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}
