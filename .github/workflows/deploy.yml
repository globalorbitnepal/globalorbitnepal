name: Deploy GlobalOrbitNepal

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-globalorbitnepal-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Generate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder for Prisma generate only. CI never connects to production PostgreSQL.
      DATABASE_URL: postgresql://globalorbitnepal_app:ci-placeholder@127.0.0.1:5432/globalorbitnepal_db?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Guard package scripts against destructive Prisma commands
        run: |
          set -euo pipefail
          if grep -E 'migrate[[:space:]]+reset|db[[:space:]]+push' package.json prisma/schema.prisma; then
            echo "DESTRUCTIVE_COMMAND_GUARD_FAIL"
            exit 1
          fi
          echo "DESTRUCTIVE_COMMAND_GUARD_OK"

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm SSH secrets exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VPS_HOST}" ]; then echo "Missing GitHub secret: VPS_HOST"; missing=1; fi
          if [ -z "${VPS_USER}" ]; then echo "Missing GitHub secret: VPS_USER"; missing=1; fi
          if [ -z "${VPS_SSH_KEY}" ]; then echo "Missing GitHub secret: VPS_SSH_KEY"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Add VPS_HOST, VPS_USER, VPS_SSH_KEY, and optional VPS_PORT in this repository Settings > Secrets and variables > Actions."
            echo "Do not put those values in the workflow file."
            exit 1
          fi

          python3 - <<'PY'
          import os, re, sys

          def fail(msg: str) -> None:
              print(msg)
              sys.exit(1)

          host = os.environ.get("VPS_HOST", "").strip()
          user = os.environ.get("VPS_USER", "").strip()
          port = os.environ.get("VPS_PORT", "").strip() or "22"
          key = os.environ.get("VPS_SSH_KEY", "")

          if host != "51.15.21.166":
              fail("SSH_IDENTITY_FAIL: VPS_HOST must be the production VPS IPv4 address")
          if "@" in host:
              fail("SSH_IDENTITY_FAIL: VPS_HOST must be an IP/hostname only, not user@host")
          if user != "sysadmin":
              fail("SSH_IDENTITY_FAIL: VPS_USER must be exactly sysadmin")
          if port != "22":
              fail("SSH_IDENTITY_FAIL: VPS_PORT must be 22")

          raw = key.replace("\r\n", "\n").replace("\r", "\n").strip()
          if raw.count("\n") < 2 and "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          if raw.count("\n") < 2 and "BEGIN" in raw and "END" in raw:
              raw = re.sub(r"[ \t]+", "\n", raw)
          if not raw.endswith("\n"):
              raw += "\n"

          if "BEGIN" not in raw or "PRIVATE KEY" not in raw or "END" not in raw:
              fail("SSH_KEY_FAIL: VPS_SSH_KEY is not a PEM/OpenSSH private key")
          if "Proc-Type: 4,ENCRYPTED" in raw:
              fail("SSH_KEY_FAIL: VPS_SSH_KEY is encrypted")

          print("SSH preflight passed: identity and key shape OK")
          PY

      - name: Deploy GlobalOrbitNepal to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          KEY_FILE="$(mktemp "${RUNNER_TEMP}/globalorbitnepal_ssh_key.XXXXXX")"
          KNOWN_HOSTS_FILE="$(mktemp "${RUNNER_TEMP}/globalorbitnepal_known_hosts.XXXXXX")"
          cleanup() {
            rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE"
          }
          trap cleanup EXIT
          export KEY_FILE
          python3 - <<'PY'
          import os, pathlib, re
          key = os.environ["VPS_SSH_KEY"]
          raw = key.replace("\r\n", "\n").replace("\r", "\n").strip()
          if raw.count("\n") < 2 and "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          if raw.count("\n") < 2 and "BEGIN" in raw and "END" in raw:
              raw = re.sub(r"[ \t]+", "\n", raw)
          if not raw.endswith("\n"):
              raw += "\n"
          path = pathlib.Path(os.environ["KEY_FILE"])
          path.write_text(raw)
          path.chmod(0o600)
          PY
          ssh-keyscan -4 -p "$port" -T 10 "${VPS_HOST}" > "$KNOWN_HOSTS_FILE" 2>/dev/null
          SSH=(ssh -4 -i "${KEY_FILE}" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -p "$port" "${VPS_USER}@${VPS_HOST}")

          echo "==> Running remote deploy script"
          "${SSH[@]}" "bash -s" <<'REMOTE'
          #!/bin/bash
          set -euo pipefail

          echo "==> Validating SSH user"
          test "$(id -un)" = "sysadmin"

          APP_DIR="/srv/apps/globalorbitnepal"
          APP_NAME="globalorbitnepal"
          APP_PORT="3031"
          EXPECTED_ORIGIN="git@github.com:globalorbitnepal/globalorbitnepal.git"

          echo "==> Isolation guards"
          test "$APP_DIR" != "/srv/apps/hostingbeyond"
          test "$APP_NAME" != "hostingbeyond"
          test "$APP_PORT" != "3000"
          test "$APP_DIR" = "/srv/apps/globalorbitnepal"
          test "$APP_NAME" = "globalorbitnepal"
          test "$APP_PORT" = "3031"

          echo "==> Deploying GlobalOrbitNepal"
          echo "==> Target: ${APP_DIR}"
          echo "==> PM2 process: ${APP_NAME}"
          echo "==> Port: ${APP_PORT}"

          cd "$APP_DIR"
          test "$(pwd)" = "$APP_DIR"

          echo "==> Validating Git remote and branch"
          test "$(git remote get-url origin)" = "$EXPECTED_ORIGIN"
          case "$(git remote get-url origin)" in
            *Hostingbeyond*|*hostingbeyond*)
              echo "REMOTE_ISOLATION_FAIL: origin points at HostingBeyond"
              exit 1
              ;;
          esac

          echo "==> Confirming GlobalOrbitNepal PM2 process exists (will not start HostingBeyond)"
          if ! pm2 describe "$APP_NAME" >/dev/null 2>&1; then
            echo "PM2_PROCESS_MISSING: ${APP_NAME} is not registered. Start it once after approval; do not start hostingbeyond."
            exit 1
          fi

          PM2_JSON="$(pm2 jlist)"
          PM2_JSON="$PM2_JSON" APP_DIR="$APP_DIR" APP_NAME="$APP_NAME" APP_PORT="$APP_PORT" python3 - <<'PY'
          import json
          import os
          import sys

          app_name = os.environ["APP_NAME"]
          app_dir = os.environ["APP_DIR"]
          app_port = os.environ["APP_PORT"]
          try:
              processes = json.loads(os.environ["PM2_JSON"])
          except json.JSONDecodeError:
              print("PM2_CONFIG_FAIL: pm2 jlist did not return valid JSON")
              sys.exit(1)

          matches = [process for process in processes if process.get("name") == app_name]
          if len(matches) != 1:
              print("PM2_CONFIG_FAIL: expected exactly one GlobalOrbitNepal process")
              sys.exit(1)

          process = matches[0]
          runtime = process.get("pm2_env") or {}
          args = str(runtime.get("args") or "")
          env = runtime.get("env") or {}
          configured_port = str(env.get("PORT") or "")
          if runtime.get("pm_cwd") != app_dir:
              print("PM2_CONFIG_FAIL: process cwd does not match the GlobalOrbitNepal app directory")
              sys.exit(1)
          if app_port not in args and configured_port != app_port:
              print("PM2_CONFIG_FAIL: process is not configured for port 3031")
              sys.exit(1)
          if runtime.get("status") != "online":
              print("PM2_CONFIG_FAIL: GlobalOrbitNepal process is not online")
              sys.exit(1)
          print("PM2_CONFIG_OK: existing GlobalOrbitNepal process matches app directory and port")
          PY

          echo "==> Syncing origin/main (preserve .env and ignore HostingBeyond paths)"
          git fetch origin main
          git checkout main
          test "$(git branch --show-current)" = "main"
          git reset --hard origin/main
          git clean -fd \
            -e .env \
            -e .env.local \
            -e .env.production \
            -e node_modules \
            -e '.port-migration-backup-*'

          if [ ! -f .env ]; then
            echo "ENV_MISSING: ${APP_DIR}/.env is required on the server and must stay untracked"
            exit 1
          fi
          echo "ENV_PRESENT"

          echo "==> Verifying DATABASE_URL target without printing secrets"
          node scripts/verify-database-target.mjs

          export CI=true
          export NODE_OPTIONS="${NODE_OPTIONS:-"--max-old-space-size=4096"}"

          echo "==> Installing dependencies"
          if [ -f package-lock.json ]; then
            npm ci </dev/null
          else
            npm install </dev/null
          fi

          echo "==> Prisma generate (no migrate reset, no db push)"
          npx prisma generate </dev/null
          npx prisma validate </dev/null

          echo "==> Building production bundle"
          npm run build </dev/null

          echo "==> Restarting ONLY GlobalOrbitNepal PM2 process"
          pm2 restart "$APP_NAME"
          pm2 describe "$APP_NAME" >/dev/null 2>&1

          echo "==> Verifying listener on 127.0.0.1:${APP_PORT}"
          LISTEN_OK=0
          for _i in $(seq 1 30); do
            if command -v ss >/dev/null 2>&1 && ss -lnt | grep -Eq ":${APP_PORT}([[:space:]]|$)"; then
              LISTEN_OK=1
              break
            fi
            sleep 1
          done
          if [ "$LISTEN_OK" != "1" ]; then
            echo "LISTEN_FAIL: nothing listening on TCP port ${APP_PORT}"
            ss -lnt || true
            exit 1
          fi

          echo "==> Verifying local HTTP on 127.0.0.1:${APP_PORT}"
          LOCAL_CODE="$(curl -fsS -o /dev/null -w "%{http_code}" --retry 8 --retry-delay 2 --retry-all-errors --max-time 20 "http://127.0.0.1:${APP_PORT}/" || true)"
          if [ "$LOCAL_CODE" != "200" ]; then
            echo "Local verify failed: expected HTTP 200 on 127.0.0.1:${APP_PORT}, got ${LOCAL_CODE:-none}"
            exit 1
          fi

          echo "==> Public domain verify skipped until DNS/Nginx are configured"
          echo "==> GlobalOrbitNepal deploy completed"
          REMOTE

          echo "==> GlobalOrbitNepal remote deploy succeeded"
